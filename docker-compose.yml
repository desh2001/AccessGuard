services:
  postgres:
    image: postgres:17-alpine
    container_name: accessguard-complete-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: accessguard_lab
      POSTGRES_USER: accessguard_lab
      POSTGRES_PASSWORD: research-local-only
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - accessguard_complete_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accessguard_lab -d accessguard_lab']
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - accessguard-net

  ml-service:
    build:
      context: ./ml/backend
      dockerfile: Dockerfile
    container_name: accessguard-ml-service
    restart: unless-stopped
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-development-token-32-chars-long-minimum-key}
      AEGIS_PLATFORM_MODEL_DIR: /app/ml_artifacts/platforms
      MIN_MODEL_COVERAGE_FRACTION: "0.995"
    volumes:
      - ./ml/backend/ml_artifacts:/app/ml_artifacts:ro
    ports:
      - '127.0.0.1:${ML_PORT:-8201}:8001'
    networks:
      - accessguard-net

  accesslog-service:
    build:
      context: ./accesslog-main
      dockerfile: Dockerfile.standalone
    container_name: accessguard-accesslog-service
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ACCESSLOG_PORT:-8202}:8002'
      - '5514:5514'
    networks:
      - accessguard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessguard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://accessguard_lab:research-local-only@postgres:5432/accessguard_lab
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-development-token-32-chars-long-minimum-key}
      ACCESSLOG_SERVICE_URL: http://accesslog-service:8002
      SENTINEL_API_URL: https://host.pasinduudana.me
      SENTINEL_INGESTION_TOKEN: sentinel_ingest_CKg9Olm8VbdcaOHFdHXj3OK1666q0qdbjA30U9MKgMQ
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8200}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
      accesslog-service:
        condition: service_started
    networks:
      - accessguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accessguard-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - backend
    networks:
      - accessguard-net

volumes:
  accessguard_complete_pgdata:

networks:
  accessguard-net:
    driver: bridge
