services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance -d governance"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://governance:${POSTGRES_PASSWORD}@db:5432/governance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:?Set DEMO_REVIEWER_PASSWORD in .env}
      SEED_DEMO: "true"
      CORS_ORIGINS: http://localhost:5173
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ML_MODEL_PATH: /app/ml_artifacts/access_anomaly_model.joblib
    volumes:
      - ./backend/ml_artifacts:/app/ml_artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
