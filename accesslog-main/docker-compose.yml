services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: accessreview
      POSTGRES_USER: accessreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessreview -d accessreview"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://accessreview:${POSTGRES_PASSWORD}@db:5432/accessreview
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET in Coolify}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://accessreview:${POSTGRES_PASSWORD}@db:5432/accessreview
      SYSLOG_PORT: 5514
    ports:
      - "10.77.0.1:5514:5514/tcp"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
